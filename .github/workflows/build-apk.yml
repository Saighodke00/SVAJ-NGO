name: Build SAVJ Android APK

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android build)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      # 5. Run Flutter doctor (for debugging if needed)
      - name: Flutter doctor
        run: flutter doctor -v

      # 6. Build release APK
      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi

      # 7. Upload APK as artifact (downloadable from Actions tab)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: savj-android-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      # 8. Create GitHub Release (only on push to master)
      - name: Create Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SAVJ Android v1.0.${{ github.run_number }}
          body: |
            ## SAVJ Mobile App
            
            ### Download
            - **app-arm64-v8a-release.apk** — for modern Android phones (2018+), recommended
            - **app-armeabi-v7a-release.apk** — for older Android phones
            
            ### Install
            1. Download the APK to your Android phone
            2. Go to Settings → Security → Enable "Install from unknown sources"
            3. Open the downloaded APK file and install
            
            ### Login
            - Register a new account or use demo: arjun@demo.com / demo1234
          files: |
            apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
