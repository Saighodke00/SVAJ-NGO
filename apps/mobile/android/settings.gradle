pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file("local.properties")
        if (localProperties.exists()) {
            localProperties.withReader("UTF-8") { properties.load(it) }
        }
        def flutterSdkPathValue = properties.getProperty("flutter.sdk")
        if (flutterSdkPathValue == null) {
            flutterSdkPathValue = System.getenv("FLUTTER_ROOT")
        }
        assert flutterSdkPathValue != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT not set"
        return flutterSdkPathValue
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
}

include ":app"
